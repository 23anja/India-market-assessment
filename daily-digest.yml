name: Daily Digest

on:
  schedule:
    # 07:00 IST = 01:30 UTC. Edit this to change the time the digest is generated.
    - cron: "30 1 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # to commit the generated site + history back to the repo
  issues: read       # to read feedback issues

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/main.py

      - name: Commit updated site
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/ data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily digest: $(date -u +'%Y-%m-%d')"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
